name: ScaleMe CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only checks: no deployment tokens or application secrets are needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies for high/critical advisories
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Generate Next.js route types
        run: npm exec -- next typegen
      - name: Check TypeScript
        run: npm exec -- tsc --noEmit
      - name: Run tests (when a test script exists)
        run: npm run test --if-present
      - name: Build production app
        run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up stable Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      # Issue #4. Not conditional: if the crate or its lockfile goes missing, this job fails
      # instead of silently skipping. `--locked` keeps the reviewed, pinned dependency versions.
      - name: Resume parser - format, lint, test and release build
        shell: bash
        run: |
          manifest=services/resume-parser/Cargo.toml
          cargo fmt --manifest-path "$manifest" --all -- --check
          cargo clippy --manifest-path "$manifest" --locked --all-targets -- -D warnings
          cargo test --manifest-path "$manifest" --locked
          cargo build --manifest-path "$manifest" --locked --release
      - name: Requirement matcher - format, lint and test (when crate exists)
        shell: bash
        run: |
          if [[ -f services/matching-rust/Cargo.toml ]]; then
            cargo fmt --manifest-path services/matching-rust/Cargo.toml --all -- --check
            cargo clippy --manifest-path services/matching-rust/Cargo.toml --all-targets -- -D warnings
            cargo test --manifest-path services/matching-rust/Cargo.toml
          else
            echo "Requirement matcher crate not yet scaffolded; skipping its checks."
          fi
